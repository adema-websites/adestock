# Servidor estático de adestock.com.ar (reemplaza a _headers de GitHub Pages).
# Traefik/Coolify termina TLS delante; acá solo HTTP en el puerto 80.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Redirecciones generadas por nginx: sin host ni puerto internos.
    absolute_redirect off;
    port_in_redirect off;

    charset utf-8;
    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/plain text/css text/xml text/markdown application/javascript application/json application/xml image/svg+xml;

    types { text/markdown md; }

    error_page 404 /404.html;

    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=0, must-revalidate" always;

    # /index.html y /carpeta/index.html -> URL canónica con barra (301). Usa $request_uri
    # (la original) para no entrar en bucle con la reescritura interna de "index".
    if ($request_uri ~ ^(.*)/index\.html(\?.*)?$) {
        return 301 $1/$2;
    }

    # Nunca servir archivos ocultos (.git, .env, etc.).
    location ~ /\.(?!well-known) { return 404; }

    location / {
        # "/carpeta" -> 301 "/carpeta/" lo hace nginx solo al resolver el directorio.
        try_files $uri $uri/ =404;
    }

    location = /404.html { internal; }

    # --- Caché de estáticos (los add_header de un location reemplazan a los del nivel superior) ---
    location ~* \.(css|js)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=604800" always;
    }
    location ^~ /img/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=2592000" always;
    }
    location ^~ /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # --- API estática de temas de revista (contrato firmado: no alterar bytes ni tipos) ---
    location = /api/temas-revista/index.json {
        default_type application/json;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=300" always;
    }
    location = /api/temas-revista/index.json.sig {
        default_type text/plain;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=300" always;
    }
    location ~ ^/api/temas-revista/.+\.zip$ {
        default_type application/zip;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Content-Disposition "attachment" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }
    location ~ ^/api/temas-revista/.+\.webp$ {
        default_type image/webp;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=86400" always;
    }
    # Sin Access-Control-Allow-Origin a propósito (CORS cerrado, igual que antes).
}
