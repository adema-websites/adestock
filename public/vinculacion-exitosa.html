<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Drive vinculado — Adestock</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #f8fafc; color: #1e293b;
            display: flex; align-items: center; justify-content: center;
            min-height: 100vh;
        }
        .card {
            background: white; border-radius: 16px;
            box-shadow: 0 4px 24px rgba(0,0,0,.08);
            padding: 2.5rem 2rem; text-align: center;
            max-width: 420px; width: 90%;
        }
        .icon {
            width: 64px; height: 64px; border-radius: 50%;
            background: #d1fae5; display: flex; align-items: center;
            justify-content: center; margin: 0 auto 1.25rem;
            font-size: 2rem;
        }
        h1 { font-size: 1.25rem; font-weight: 700; margin-bottom: .5rem; color: #065f46; }
        p  { font-size: .95rem; color: #64748b; line-height: 1.5; }
        .close-hint {
            margin-top: 1.5rem; font-size: .8rem; color: #94a3b8;
        }
    </style>
</head>
<body>
<div class="card">
    <div class="icon">✅</div>
    <h1>¡Google Drive vinculado!</h1>
    <p>Tu cuenta de Google Drive fue conectada correctamente a Adestock.<br>
       Ya podés cerrar esta ventana y volver a la aplicación.</p>
    <p class="close-hint">Podés cerrar esta pestaña.</p>
</div>
    <script src="site-nav.js"></script>
</body>
</html>
